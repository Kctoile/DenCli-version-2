name: DenCli CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('DenCli/**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and test
        working-directory: ./DenCli
        run: mvn -B clean verify

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: DenCli-war
          path: DenCli/target/*.war
          if-no-files-found: error

  sonar:
    name: SonarCloud analysis
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 17
          distribution: zulu
      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Analyze
        if: env.SONAR_TOKEN != ''
        working-directory: ./DenCli
        run: mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Kctoile_DenCli-version-2 -Dsonar.organization=kctoile -Dsonar.host.url=https://sonarcloud.io
      - name: Skip SonarCloud when token is not configured
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not configured; skipping SonarCloud analysis."

  deploy-tomcat:
    name: Deploy to local Tomcat
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, tomcat-local]
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: DenCli-war
          path: deploy-artifact
      - name: Deploy WAR to Tomcat
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $tomcatHome = 'C:\Program Files\Apache Software Foundation\Tomcat 10.1'
          $webapps = Join-Path $tomcatHome 'webapps'
          $war = Get-ChildItem 'deploy-artifact\*.war' | Select-Object -First 1
          if (-not $war) { throw 'WAR artifact was not found.' }
          Remove-Item (Join-Path $webapps 'DenCli') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $webapps 'DenCli.war') -Force -ErrorAction SilentlyContinue
          Copy-Item $war.FullName (Join-Path $webapps 'DenCli.war')
          Write-Host "Deployed $($war.Name) to $webapps"
