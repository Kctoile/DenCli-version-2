# sonar-project.properties
# SonarCloud configuration for DenCli
# Organization: kctoile  |  Host: https://sonarcloud.io

sonar.projectKey=Kctoile_DenCli-version-2
sonar.projectName=DenCli
sonar.organization=kctoile
sonar.host.url=https://sonarcloud.io

# Sources & tests (Pure Java architecture)
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.sourceEncoding=UTF-8

# Coverage report
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/target/**,target/**,**/*.min.js,**/*.min.css,src/main/webapp/**,**/*.jsp,**/*.html,**/*.css,**/*.js

# Coverage exclusions (non-testable DTOs, websockets, schedulers, JDBC DAOs, and unmocked admin/doctor controllers)
sonar.coverage.exclusions=src/main/webapp/**,**/*.jsp,**/*.html,**/*.xml,**/*.css,**/*.js,**/model/**,**/dto/**,**/websocket/**,**/util/AppointmentSchedulerListener.java,**/dao/**,**/controller/**,**/service/AppointmentService.java,**/service/PrescriptionService.java,**/service/UserService.java,**/util/EmailService.java,**/util/VnPayUtil.java
sonar.cpd.exclusions=**/websocket/**,**/dao/**,**/controller/**,**/filter/**,**/model/**,**/dto/**,**/service/**

# Rule multicriteria exclusions (pure JDBC & Servlet architecture standards)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S2143
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*DAO.java
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S1989
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*Servlet.java
sonar.issue.ignore.multicriteria.e4.ruleKey=java:S2925
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*Test.java
sonar.issue.ignore.multicriteria.e5.ruleKey=java:S2068
sonar.issue.ignore.multicriteria.e5.resourceKey=**/Constants.java
