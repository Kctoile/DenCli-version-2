# sonar-project.properties
# SonarCloud configuration for DenCli
# Organization: kctoile  |  Host: https://sonarcloud.io

sonar.projectKey=Kctoile_DenCli-version-2
sonar.projectName=DenCli
sonar.organization=kctoile
sonar.host.url=https://sonarcloud.io

# Sources & tests
sonar.sources=src/main/java,src/main/webapp
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.sourceEncoding=UTF-8

# Coverage report
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/target/**,target/**,**/*.min.js,**/*.min.css

# Coverage exclusions (non-testable frontend templates, DTOs, interfaces, websockets, schedulers)
sonar.coverage.exclusions=src/main/webapp/**,**/*.jsp,**/*.html,**/*.xml,**/*.css,**/*.js,**/model/**,**/websocket/**,**/util/AppointmentSchedulerListener.java,**/dao/*DAO.java,**/service/*Service.java
