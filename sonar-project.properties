# sonar-project.properties (Root Workspace)
# SonarCloud configuration for DenCli
# Organization: kctoile  |  Host: https://sonarcloud.io

sonar.projectKey=Kctoile_DenCli-version-2
sonar.projectName=DenCli
sonar.organization=kctoile
sonar.host.url=https://sonarcloud.io

# Sources & tests (Pure Java architecture)
sonar.sources=DenCli/src/main/java
sonar.tests=DenCli/src/test/java
sonar.java.binaries=DenCli/target/classes
sonar.sourceEncoding=UTF-8

# Coverage report
sonar.coverage.jacoco.xmlReportPaths=DenCli/target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/target/**,target/**,DenCli/target/**,**/target/**/*,**/*.min.js,**/*.min.css,**/src/main/webapp/**,**/*.jsp,**/*.html,**/*.css,**/*.js

# Coverage exclusions (non-testable DTOs, websockets, schedulers)
sonar.coverage.exclusions=DenCli/src/main/webapp/**,**/src/main/webapp/**,src/main/webapp/**,**/*.jsp,**/*.html,**/*.xml,**/*.css,**/*.js,**/model/**,**/dto/**,**/websocket/**,**/util/AppointmentSchedulerListener.java

# Rule multicriteria exclusions (pure JDBC & Servlet architecture standards)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S2143
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*DAO.java
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S1989
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*Servlet.java
sonar.issue.ignore.multicriteria.e4.ruleKey=java:S2925
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*Test.java
